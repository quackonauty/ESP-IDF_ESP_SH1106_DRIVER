version: "1.1.0"

description: "Lightweight and thread-safe SH1106 (1.3-inch, 128x64) OLED display driver for ESP-IDF. Features dirty-page tracking, partial updates, and full rendering API over I2C."

license: "Apache-2.0"

targets:
  - esp32
  - esp32s3
  - esp32c2
  - esp32c3
  - esp32c5
  - esp32c6
  - esp32c61
  - esp32h2

tags:
  - display
  - oled
  - sh1106
  - i2c
  - driver

dependencies:
  idf:
    version: ">=6.0.0"
